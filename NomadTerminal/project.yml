name: NomadTerminal
options:
  bundleIdPrefix: io.nomadterminal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.3
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    from: 11.26.0
targets:
  NomadTerminal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # Real xcodegen 2.46.0 bug (confirmed in an isolated minimal repro,
      # unrelated to anything in this project): the top-level `resources:`
      # key silently produces zero PBXResourcesBuildPhase on this machine's
      # Xcode — Assets.car and the fonts never made it into the built app
      # (this is why the app icon showed blank on the home screen).
      # `sources:` auto-detects non-Swift file types and routes them to
      # the right build phase correctly, so this is the workaround: list
      # them here instead of under `resources:`.
      - path: Resources/Fonts
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: Supabase
        product: Supabase
      - package: MapboxMaps
        product: MapboxMaps
      - target: NomadTerminalWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nomadterminal.app
        PRODUCT_NAME: NomadTerminal
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8FKZYTQB3B
        # App Group — lets ProfileView hand a small stats snapshot
        # (km/countries/streak/heatmap) to the widget extension process,
        # which has no DB/network access of its own. See Sources/Shared/
        # WidgetSnapshot.swift.
        CODE_SIGN_ENTITLEMENTS: NomadTerminal.entitlements
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Nomad
        # English (development/base), Ukrainian, Spanish — real
        # translations in Resources/Localizable.xcstrings, not just this
        # declaration. Lets the App Store and iOS's own per-app language
        # picker (Settings > Nomad > Language) know what's
        # actually supported.
        CFBundleLocalizations:
          - en
          - uk
          - es
        UILaunchScreen: {}
        # No UIUserInterfaceStyle / UIStatusBarStyle lock, and
        # UIViewControllerBasedStatusBarAppearance defaults to true — both
        # would hard-override SwiftUI's .preferredColorScheme, which is now
        # how the real Pine/Milk theme switch (ThemeManager) actually works.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Lets you photograph a trail hazard (fallen tree, broken bridge, deep ford) when you report it, so the next person can see what to expect."
        NSLocationWhenInUseUsageDescription: "Shows your live position on the map and your real track while recording — plus a last-known position for the SOS screen if you ever need it."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Background location keeps your live track and last-known SOS position accurate while the app is in your pocket, and — only if you turn on Passive visit detection in Settings — quietly notices new places you've stopped for your Journal."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - location
        # Catches Google's OAuth redirect back into the app — GoTrue's own
        # web flow (ASWebAuthenticationSession, driven by Supabase's
        # signInWithOAuth) needs a custom scheme to hand control back once
        # Google's consent page finishes. Apple Sign In doesn't use this —
        # native ASAuthorizationController + Supabase's ID-token flow never
        # leaves the app.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - io.nomadterminal.app
            CFBundleURLName: io.nomadterminal.app.oauth
        # GPX isn't a system-known UTType, so it has to be declared before
        # the app can register as a viewer for it below. This is the real
        # mechanism behind "Поділитись → Nomad" showing up as a "Copy to
        # Nomad" destination in another app's Share Sheet (Strava, Garmin
        # Connect, Komoot's own "export GPX"), and behind the Files app's
        # "Open In Nomad" — no separate Share Extension target needed for
        # either; both read directly off CFBundleDocumentTypes below. The
        # file itself is delivered via `.onOpenURL` (see
        # `NomadTerminalApp.swift`/`PendingImportCoordinator`).
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.nomadterminal.app.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX Track
            LSItemContentTypes:
              - io.nomadterminal.app.gpx
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
        # Public runtime token (safe to ship client-embedded, same as
        # Supabase's anon key) — the separate secret download token lives
        # only in ~/.netrc for SPM to fetch the SDK, never in the repo.
        MBXAccessToken: "pk.eyJ1IjoiaWxseWFvdmFsaXVrIiwiYSI6ImNtc21ibmdvcTA5aHQyeXNhbXAwdm1zYmgifQ.UVzACeEXBUp3GyVAGX4w9Q"
        UIAppFonts:
          - PublicSans-Light.ttf
          - PublicSans-Regular.ttf
          - PublicSans-Medium.ttf
          - PublicSans-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf

  NomadTerminalWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
      - path: Sources/LiveActivity
      - path: Sources/Shared
      - path: Sources/DesignSystem/NTColor.swift
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nomadterminal.app.widgets
        PRODUCT_NAME: NomadTerminalWidgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8FKZYTQB3B
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: WidgetExtension.entitlements
    info:
      path: Generated/WidgetExtension-Info.plist
      properties:
        CFBundleDisplayName: Nomad
        CFBundleLocalizations:
          - en
          - uk
          - es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Logic-only tests (no UI, no need to run hosted inside the app's own
  # process) — plain `@testable import NomadTerminal`, linked against the
  # main target rather than TEST_HOST/BUNDLE_LOADER-hosted in it.
  NomadTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/NomadTerminalTests
    dependencies:
      - target: NomadTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nomadterminal.app.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NomadTerminal:
    build:
      targets:
        NomadTerminal: all
        NomadTerminalTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
      targets:
        - NomadTerminalTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
