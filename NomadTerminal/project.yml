name: NomadTerminal
options:
  bundleIdPrefix: io.nomadterminal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.29.3
targets:
  NomadTerminal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Fonts
      - path: Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nomadterminal.app
        PRODUCT_NAME: NomadTerminal
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: NomadTerminal
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Turn-by-turn on unnamed tracks, and an SOS ping that still works with no signal."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Background location keeps your live track and SOS beacon accurate while the app is in your pocket."
        UIAppFonts:
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - PublicSans-Light.ttf
          - PublicSans-Regular.ttf
          - PublicSans-Medium.ttf
          - PublicSans-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - Newsreader-LightItalic.ttf
schemes:
  NomadTerminal:
    build:
      targets:
        NomadTerminal: all
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
